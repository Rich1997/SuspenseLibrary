name: Update YouTube Playlist Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}    # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Fetch playlist data
        run: node src/scripts/fetch-playlist.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}

      - name: Update video statistics
        run: node src/scripts/update-stats.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/playlist.json
          git diff --staged --quiet || git commit -m "chore: update playlist data"
          git push